[package]
name = "trading_data_dag"
description = "Compile-time dependency-DAG derivation engine: GAT cells, type-indexed frames, monomorphized sweeps"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*"]
autotests = false

[features]
# `#[inline(never)]` on every `step*`, so a profiler resolves one frame per node. Never in a
# `default` set and never enabled by a dependency — it is an explicit `--features profile` or it is
# absent from codegen.
profile = []

[dependencies]
trading_data_expr.workspace = true
trading_data_macros.workspace = true
# `Horizon::Span` is a `Timeframe`, which is a std type — so this crate is no longer `no_std`.
v_utils.workspace = true

[dev-dependencies]
iai-callgrind.workspace = true
insta.workspace = true

[[bench]]
name = "sweep"
harness = false

[[bench]]
name = "kernel_cost"
harness = false

[[bench]]
name = "buffer_cost"
harness = false

[[test]]
name = "it"
path = "tests/it/main.rs"

# defines the `Deprec` and `Ticks` nodes `it::latch` defines too, and node shims are crate-global `macro_export`s
[[test]]
name = "internal_latch"
path = "tests/internal_latch.rs"

[lints]
workspace = true
